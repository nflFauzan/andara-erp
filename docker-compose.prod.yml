version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: andara-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andara_erp}
      POSTGRES_USER: ${POSTGRES_USER:-andara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - andara-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andara_user} -d ${POSTGRES_DB:-andara_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: andara-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-andara_erp}
      DATABASE_USERNAME: ${POSTGRES_USER:-andara_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      APP_DOMAIN: ${APP_DOMAIN:-https://andara.co.id}
      STORAGE_TYPE: ${STORAGE_TYPE:-r2}
      STORAGE_LOCAL_DIR: /app/uploads
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-andara-files}
      R2_REGION: ${R2_REGION:-auto}
    volumes:
      - app_uploads:/app/uploads
    networks:
      - andara-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andara-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - andara-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  andara-internal:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  app_uploads:
    driver: local
