server {
    listen 80;
    listen [::]:80;
    server_name cvandaraerp.web.id www.cvandaraerp.web.id;

    # Cloudflare menerima koneksi HTTP dari luar lalu forward ke sini.
    # Redirect semua HTTP → HTTPS (Cloudflare yang handle SSL ke client).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cvandaraerp.web.id www.cvandaraerp.web.id;

    # Cloudflare Origin Certificate
    # Generate di: Cloudflare → SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/nginx/ssl/cvandaraerp.web.id.pem;
    ssl_certificate_key /etc/nginx/ssl/cvandaraerp.web.id.key;

    # SSL hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static Assets — cache 1 tahun (Vite generates content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # API Reverse Proxy → Spring Boot Backend (internal Docker network)
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Buffer settings untuk response besar
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # Spring Boot Actuator Health — untuk UptimeRobot monitoring
    location /actuator/health {
        proxy_pass         http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        access_log off;
    }

    # SPA Fallback — React Router (semua path dikembalikan ke index.html)
    location / {
        try_files $uri $uri/ /index.html;
        # Jangan cache index.html agar deployment baru langsung efektif
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Deny akses ke hidden files (.git, .env, dsb)
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    # Deny akses langsung ke file sensitif
    location ~ \.(env|sh|sql|log)$ {
        deny all;
        access_log  off;
        log_not_found off;
    }
}
