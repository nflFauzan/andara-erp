services:
  postgres:
    image: postgres:16-alpine
    container_name: andara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andara_erp}
      POSTGRES_USER: ${POSTGRES_USER:-andara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andara_dev_password_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andara_user} -d ${POSTGRES_DB:-andara_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - andara-network

networks:
  andara-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
