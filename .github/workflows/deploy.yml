name: Deploy to Production

on:
  push:
    branches:
      - main

# Hanya satu deployment berjalan dalam satu waktu
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ke VPS — cvandaraerp.web.id
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY belum diset di GitHub Secrets!"
            exit 1
          fi

          RAW_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          if echo "$RAW_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "$RAW_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          else
            # Support base64 encoded private key jika user menyimpannya dalam format base64
            echo "$RAW_KEY" | base64 -d | tr -d '\r' > ~/.ssh/id_deploy 2>/dev/null || echo "$RAW_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          fi
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Validasi format key sebelum digunakan
          if ! ssh-keygen -l -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::Format SSH_PRIVATE_KEY tidak valid. Pastikan yang dimasukkan adalah PRIVATE KEY (bukan .pub atau token)."
            exit 1
          fi

          ssh-keyscan -H 202.155.14.98 >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          cat << 'EOF' > ~/.ssh/config
          Host 202.155.14.98
            HostName 202.155.14.98
            User root
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      # -------------------------------------------------------
      - name: Deploy ke VPS
        run: |
          ssh root@202.155.14.98 << 'ENDSSH'
            set -e

            echo "=== [1/4] Update kode dari repository ==="
            cd /opt/andara-erp
            git pull origin main

            echo "=== [2/4] Backup database sebelum deploy ==="
            if docker ps --format '{{.Names}}' | grep -q "^andara-postgres-prod$"; then
              bash /opt/andara-erp/infrastructure/scripts/backup.sh || echo "⚠️ Backup pre-deploy gagal, melanjutkan deploy..."
            else
              echo "ℹ️ Container database belum aktif, skip backup pre-deploy."
            fi

            echo "=== [3/4] Build & restart container ==="
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build

            echo "=== [4/4] Verifikasi deployment ==="
            sleep 8
            docker compose -f docker-compose.prod.yml --env-file .env ps
          ENDSSH

      # -------------------------------------------------------
      - name: Health Check — Pastikan aplikasi berjalan
        run: |
          echo "Menunggu aplikasi siap..."
          sleep 15
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://cvandaraerp.web.id/actuator/health || echo "000")

          echo "HTTP Status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" = "200" ]; then
            echo "✅ Deployment berhasil! Aplikasi berjalan normal."
          else
            echo "❌ Health check gagal (status: ${HTTP_STATUS})"
            echo "Cek log: ssh root@202.155.14.98 'docker compose -f /opt/andara-erp/docker-compose.prod.yml logs --tail=50 backend'"
            exit 1
          fi

      # -------------------------------------------------------
      - name: Notifikasi sukses (ringkasan)
        if: success()
        run: |
          echo "🚀 Deployment ke cvandaraerp.web.id BERHASIL"
          echo "Commit : ${{ github.sha }}"
          echo "Oleh   : ${{ github.actor }}"
          echo "Waktu  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Notifikasi gagal
        if: failure()
        run: |
          echo "💥 Deployment ke cvandaraerp.web.id GAGAL"
          echo "Commit : ${{ github.sha }}"
          echo "Oleh   : ${{ github.actor }}"
          echo "Cek Actions log di atas untuk detail error."
