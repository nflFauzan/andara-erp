server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        secure: false
        same-site: lax
        name: ANDARA_SESSION

spring:
  application:
    name: andara-erp-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Jakarta

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
