spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/andara_erp}
    username: ${DATABASE_USERNAME:andara_user}
    password: ${DATABASE_PASSWORD:andara_dev_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket-name: ${R2_BUCKET_NAME:andara-files}
      region: ${R2_REGION:auto}
